<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人狼メモ</title>
</head>
<body>
    <div class="app-container">
        <!-- ヘッダー・全体制御 -->
        <header class="main-header">
            <h1 class="main-title">🐺 人狼メモ</h1>
            <div class="control-panel">
                <div class="control-group">
                    <label for="input-member-count">参加人数:</label>
                    <input type="number" id="input-member-count" min="3" max="20" value="13">
                </div>
                <div class="control-group">
                    <span class="label-text">プレイ日数:</span>
                    <button type="button" class="btn btn-sm btn-secondary" id="btn-day-down">－</button>
                    <span class="display-value" id="display-days">3</span>
                    <button type="button" class="btn btn-sm btn-secondary" id="btn-day-up">＋</button>
                </div>
                <button type="button" class="btn btn-danger" id="btn-open-reset">消去</button>
            </div>
        </header>

        <!-- メインコンテンツ -->
        <main class="main-content">
            <!-- ① プレイヤー一覧 & 投票履歴 -->
            <section class="section-block">
                <h2 class="section-title">👤 プレイヤー一覧 & 投票履歴</h2>
                <div class="table-scroll-container" id="player-scroll-container">
                    <div class="table-header-sticky-row" id="player-table-header">
                        <!-- JSで動的生成 -->
                    </div>
                    <div class="table-body-sortable" id="player-table-body">
                        <!-- JSで動的生成 -->
                    </div>
                </div>
            </section>

            <!-- ② 占い・霊能・騎士COメモ -->
            <section class="section-block">
                <div class="section-title-wrap">
                    <h2 class="section-title">🔮 占い・霊能・騎士COメモ</h2>
                    <div class="co-controls">
                        <button type="button" class="btn btn-sm btn-secondary" id="btn-co-down">COを減らす</button>
                        <button type="button" class="btn btn-sm btn-secondary" id="btn-co-up">COを追加</button>
                    </div>
                </div>
                <div class="table-scroll-container" id="co-scroll-container">
                    <div class="table-header-sticky-row" id="co-table-header">
                        <!-- JSで動的生成 -->
                    </div>
                    <div class="table-body-sortable" id="co-table-body">
                        <!-- JSで動的生成 -->
                    </div>
                </div>
            </section>

            <!-- ③ 吊り・噛み記録メモ -->
            <section class="section-block">
                <h2 class="section-title">💀 吊り・噛み記録メモ</h2>
                <div class="table-scroll-container" id="death-scroll-container">
                    <div class="table-header-sticky-row" id="death-table-header">
                        <!-- JSで動的生成 -->
                    </div>
                    <div class="table-body-sortable" id="death-table-body">
                        <!-- JSで動的生成 -->
                    </div>
                </div>
            </section>

            <!-- ④ 自動集計データサマリー -->
            <section class="section-block summary-section">
                <details class="summary-details" id="summary-toggle">
                    <summary class="summary-summary">📊 自動集計データサマリー (クリックで開閉)</summary>
                    <div class="summary-content" id="summary-container">
                        <!-- JSで動的生成 -->
                    </div>
                </details>
            </section>

            <!-- ⑤ 自由メモ欄 -->
            <section class="section-block">
                <h2 class="section-title">📝 自由メモ欄</h2>
                <textarea id="free-memo" class="free-textarea" placeholder="自由に入力してください..."></textarea>
            </section>
        </main>
    </div>

    <!-- ⑥ リセットモーダルダイアログ -->
    <div class="modal-overlay" id="reset-modal">
        <div class="modal-box">
            <h3 class="modal-title">データの消去</h3>
            <p class="modal-message">リセット方法を選択してください。この操作は取り消せません。</p>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="btn-reset-cancel">キャンセル</button>
                <button type="button" class="btn btn-warning" id="btn-reset-keep-names">名前残しでリセット</button>
                <button type="button" class="btn btn-danger" id="btn-reset-all">完全にリセット</button>
            </div>
        </div>
    </div>

    <!-- 共通データリスト -->
    <datalist id="roles-datalist">
        <option value="市民"></option>
        <option value="人狼"></option>
        <option value="占師"></option>
        <option value="霊媒"></option>
        <option value="騎士"></option>
        <option value="狂人"></option>
        <option value="狂信"></option>
        <option value="妖狐"></option>
        <option value="パン"></option>
    </datalist>
<style>
/* デザインシステム & 共通設定 */
:root {
    --bg-main: #121212;
    --bg-container: #1e1e1e;
    --bg-table: #161616;
    --bg-input: #2a2a2a;
    --text-main: #e0e0e0;
    --text-mute: #888888;
    --text-white: #ffffff;
    
    /* 判定連動カラー */
    --color-gray: #e0e0e0;
    --color-human-pref: #2e7d32;
    --color-human-cert: #4caf50;
    --color-mad: #ffeb3b;
    --color-wolf-pref: #ff9800;
    --color-wolf-cert: #f44336;
    
    /* 状態トグルカラー */
    --status-alive: #2e7d32;
    --status-voted: #c62828;
    --status-bitten: #ef6c00;
    
    /* 占い判定トグルカラー */
    --result-human: #15803d;
    --result-wolf: #b91c1c;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding: 10px;
}

.app-container {
    max-width: 1200px;
    margin: 0 auto;
    background-color: var(--bg-container);
    border-radius: 8px;
    padding: 15px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
}

/* ヘッダー周り */
.main-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    border-bottom: 2px solid #333;
    padding-bottom: 15px;
    margin-bottom: 20px;
}

.main-title {
    font-size: 1.8rem;
    font-weight: bold;
}

.control-panel {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.control-group {
    display: flex;
    align-items: center;
    gap: 8px;
}

.display-value {
    display: inline-block;
    min-width: 24px;
    text-align: center;
    font-weight: bold;
    font-size: 1.1rem;
}
/* ボタン・共通コンポーネント */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 4px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.2s, opacity 0.2s;
    color: var(--text-white);
}

.btn-sm {
    padding: 4px 10px;
    font-size: 12px;
}

.btn-secondary { background-color: #444; }
.btn-secondary:hover { background-color: #555; }
.btn-danger { background-color: #b91c1c; }
.btn-danger:hover { background-color: #dc2626; }
.btn-warning { background-color: #d97706; }
.btn-warning:hover { background-color: #f59e0b; }

/* フォーム要素 */
input[type="number"],
input[type="text"],
select,
textarea {
    background-color: var(--bg-input);
    color: var(--text-white);
    border: 1px solid #444;
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 14px;
}

input[type="number"] {
    width: 65px;
    text-align: center;
}

/* 各セクションブロック */
.section-block {
    background-color: var(--bg-table);
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 20px;
}

.section-title {
    font-size: 1.1rem;
    font-weight: bold;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.section-title-wrap {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.section-title-wrap .section-title {
    margin-bottom: 0;
}

.co-controls {
    display: flex;
    gap: 8px;
}

/* 自由メモ */
.free-textarea {
    width: 100%;
    height: 120px;
    resize: vertical;
    font-family: inherit;
}
/* 横スクロールコンテナ */
.table-scroll-container {
    width: 100%;
    overflow-x: auto;
    position: relative;
    border: 1px solid #333;
    background-color: #111;
}

/* ヘッダー・ボディの共通構造行 */
.table-header-sticky-row,
.table-row-item {
    display: flex;
    min-width: max-content;
    align-items: center;
    border-bottom: 1px solid #222;
    background-color: var(--bg-table);
}

.table-header-sticky-row {
    background-color: #222;
    font-weight: bold;
    position: sticky;
    top: 0;
    z-index: 10;
}

/* セル基本設定 */
.cell-item {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 4px;
    border-right: 1px solid #222;
    height: 38px;
    flex-shrink: 0;
    overflow: hidden;
}

.cell-item select,
.cell-item input {
    width: 100%;
    height: 100%;
    font-size: 12px;
    padding: 2px;
}

/* ドラッグハンドラー */
.col-handle {
    width: 30px;
    cursor: grab;
    user-select: none;
    color: var(--text-mute);
    font-size: 14px;
}
.col-handle:active {
    cursor: grabbing;
}

/* スクリプトドラッグ中の視覚効果 */
.table-row-item.dragging {
    opacity: 0.5;
    background-color: #333;
}

/* --- 上段（プレイヤー一覧）固定累積幅ルール --- */
#player-scroll-container .col-handle { position: sticky; left: 0px; z-index: 5; background-color: inherit; }
#player-scroll-container .col-name   { width: 90px; position: sticky; left: 30px; z-index: 5; background-color: inherit; }
#player-scroll-container .col-role   { width: 70px; position: sticky; left: 120px; z-index: 5; background-color: inherit; }
#player-scroll-container .col-cert   { width: 80px; position: sticky; left: 190px; z-index: 5; background-color: inherit; }
#player-scroll-container .col-day-vote { width: 90px; } /* 可変日数エリア（270px以降） */

/* --- 中段（占い・霊能・騎士COメモ）固定累積幅ルール --- */
#co-scroll-container .col-handle  { position: sticky; left: 0px; z-index: 5; background-color: inherit; }
#co-scroll-container .col-co-name { width: 100px; position: sticky; left: 30px; z-index: 5; background-color: inherit; }
#co-scroll-container .col-co-type { width: 70px; position: sticky; left: 130px; z-index: 5; background-color: inherit; } /* 鉄壁ロック位置 */
#co-scroll-container .col-day-report { width: 160px; display: flex; gap: 4px; padding: 4px; } /* 可変結果エリア（200px以降） */

/* --- 下段（吊り・噛み記録メモ）固定累積幅ルール --- */
#death-scroll-container .col-handle     { width: 30px; position: sticky; left: 0px; z-index: 5; background-color: inherit; }
#death-scroll-container .col-death-type { width: 100px; position: sticky; left: 30px; z-index: 5; background-color: inherit; font-weight: bold; }
#death-scroll-container .col-day-death  { width: 90px; }
/* 判定連動リアルタイム文字カラー */
.cert-gray input, .cert-gray select { color: var(--color-gray) !important; }
.cert-wolf-cert input, .cert-wolf-cert select { color: var(--color-wolf-cert) !important; font-weight: bold; }
.cert-wolf-pref input, .cert-wolf-pref select { color: var(--color-wolf-pref) !important; }
.cert-mad input, .cert-mad select { color: var(--color-mad) !important; }
.cert-human-cert input, .cert-human-cert select { color: var(--color-human-cert) !important; font-weight: bold; }
.cert-human-pref input, .cert-human-pref select { color: var(--color-human-pref) !important; }

/* 死亡取り消し線完全同期 */
.row-player-dead input,
.row-player-dead select {
    text-decoration: line-through #ff4444;
    opacity: 0.6;
}

/* 能力・結果トグル内コンポーネント */
.co-target-select {
    flex: 1;
    min-width: 60px;
    height: 100%;
}

.co-result-toggle-btn {
    width: 50px;
    height: 100%;
    border: none;
    border-radius: 3px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    color: var(--text-white);
    text-align: center;
    padding: 0;
}

.res-bg-human { background-color: var(--result-human); }
.res-bg-wolf { background-color: var(--result-wolf); }

/* 自動集計サマリー */
.summary-details {
    width: 100%;
}
.summary-summary {
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    padding: 4px;
    user-select: none;
}
.summary-content {
    margin-top: 15px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.summary-card {
    background-color: #222;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 10px;
}
.summary-card-header {
    font-size: 1rem;
    font-weight: bold;
    border-bottom: 1px solid #444;
    padding-bottom: 4px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
}
.summary-card-body {
    font-size: 13px;
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.summary-item-title {
    font-weight: bold;
    color: #aaa;
}

/* リセットモーダル */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
}
.modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
}
.modal-box {
    background-color: var(--bg-container);
    border: 2px solid #444;
    border-radius: 8px;
    padding: 20px;
    width: 90%;
    max-width: 455px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.8);
}
.modal-title {
    font-size: 1.3rem;
    font-weight: bold;
    margin-bottom: 12px;
    color: var(--text-white);
}
.modal-message {
    font-size: 14px;
    color: var(--text-main);
    margin-bottom: 20px;
}
.modal-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
@media (min-width: 400px) {
    .modal-actions {
        flex-direction: row;
        justify-content: space-between;
    }
}
</style>
<script>
(function() {
    // 状態定義のデータスキーマ
    let state = {
        memberCount: 13,
        daysCount: 3,
        coCount: 2,
        players: [], // { id, name, role, cert, votes: [] }
        coRows: [],  // { id, nameId, type, reports: [ { targetId, isWolf } ] }
        deaths: {
            voted: [], // 各インデックス＝日目(0から)のプレイヤーID
            bitten: []
        },
        freeMemo: ""
    };

    // ローカルストレージキー
    const STORAGE_KEY = "jinro_memo_v2_saveData";

    // DOM要素の取得
    const elMemberCount = document.getElementById("input-member-count");
    const elDisplayDays = document.getElementById("display-days");
    const elBtnDayDown = document.getElementById("btn-day-down");
    const elBtnDayUp = document.getElementById("btn-day-up");
    const elBtnOpenReset = document.getElementById("btn-open-reset");
    const elBtnCoDown = document.getElementById("btn-co-down");
    const elBtnCoUp = document.getElementById("btn-co-up");
    const elFreeMemo = document.getElementById("free-memo");
    
    const elResetModal = document.getElementById("reset-modal");
    const elBtnResetCancel = document.getElementById("btn-reset-cancel");
    const elBtnResetKeepNames = document.getElementById("btn-reset-keep-names");
    const elBtnResetAll = document.getElementById("btn-reset-all");

    const elPlayerHeader = document.getElementById("player-table-header");
    const elPlayerBody = document.getElementById("player-table-body");
    const elCoHeader = document.getElementById("co-table-header");
    const elCoBody = document.getElementById("co-table-body");
    const elDeathHeader = document.getElementById("death-table-header");
    const elDeathBody = document.getElementById("death-table-body");
    const elSummaryContainer = document.getElementById("summary-container");

    // 初期起動ロジック
    function init() {
        loadFromStorage();
        renderAll();
        setupGlobalEvents();
    }

    // ストレージ保存
    function saveToStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // ストレージ読み込み
    function loadFromStorage() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (parsed && typeof parsed === "object") {
                    state = Object.assign(state, parsed);
                    // 入力フォームの値に同期
                    elMemberCount.value = state.memberCount;
                    elDisplayDays.textContent = state.daysCount;
                    elFreeMemo.value = state.freeMemo || "";
                    return;
                }
            } catch (e) {
                console.error("ストレージデータが破損しています", e);
            }
        }
        // セーブデータがないか破損時はデフォルト生成
        resetStateDefault(13, 3);
    }
    // デフォルトデータの生成
    function resetStateDefault(members, days) {
        state.memberCount = members;
        state.daysCount = days;
        state.coCount = 2;
        state.players = [];
        for (let i = 1; i <= members; i++) {
            state.players.push({
                id: "p_" + Date.now() + "_" + i + "_" + Math.random().toString(36).substr(2, 4),
                name: String(i),
                role: "",
                cert: "グレー",
                votes: Array(10).fill("")
            });
        }
        state.coRows = [];
        for (let i = 0; i < state.coCount; i++) {
            state.coRows.push({
                id: "co_" + Date.now() + "_" + i + "_" + Math.random().toString(36).substr(2, 4),
                nameId: "",
                type: "占師",
                reports: Array(10).fill(null).map(() => ({ targetId: "", isWolf: false }))
            });
        }
        state.deaths = {
            voted: Array(10).fill(""),
            bitten: Array(10).fill("")
        };
        state.freeMemo = "";
        
        elMemberCount.value = members;
        elDisplayDays.textContent = days;
        elFreeMemo.value = "";
    }

    // 全体の再レンダリングを集中管理
    function renderAll() {
        renderPlayerTable();
        renderCoTable();
        renderDeathTable();
        renderSummary();
    }

    // グローバルなUI操作系イベント設定
    function setupGlobalEvents() {
        // 参加人数増減イベント
        elMemberCount.addEventListener("change", function() {
            let val = parseInt(elMemberCount.value, 10);
            if (isNaN(val) || val < 3) val = 3;
            if (val > 20) val = 20;
            elMemberCount.value = val;
            adjustMemberCount(val);
        });

        // プレイ日数増加
        elBtnDayUp.addEventListener("click", function() {
            if (state.daysCount >= 10) return;
            state.daysCount++;
            elDisplayDays.textContent = state.daysCount;
            saveToStorage();
            renderAll();
        });

        // プレイ日数減少
        elBtnDayDown.addEventListener("click", function() {
            if (state.daysCount <= 1) return;
            const targetIdx = state.daysCount - 1;
            
            // 削除対象日にデータが存在するかチェック
            let hasData = false;
            if (state.deaths.voted[targetIdx] || state.deaths.bitten[targetIdx]) hasData = true;
            state.players.forEach(p => { if (p.votes[targetIdx]) hasData = true; });
            state.coRows.forEach(c => { if (c.reports[targetIdx] && c.reports[targetIdx].targetId) hasData = true; });

            if (hasData) {
                if (!confirm((targetIdx + 1) + "日目のデータが存在します。この日を削除してもよろしいですか？")) {
                    return;
                }
            }

            // データクリーンアップ
            state.deaths.voted[targetIdx] = "";
            state.deaths.bitten[targetIdx] = "";
            state.players.forEach(p => { p.votes[targetIdx] = ""; });
            state.coRows.forEach(c => {
                if (c.reports[targetIdx]) {
                    c.reports[targetIdx].targetId = "";
                    c.reports[targetIdx].isWolf = false;
                }
            });

            state.daysCount--;
            elDisplayDays.textContent = state.daysCount;
            saveToStorage();
            renderAll();
        });
        // CO行追加
        elBtnCoUp.addEventListener("click", function() {
            state.coCount++;
            state.coRows.push({
                id: "co_" + Date.now() + "_" + state.coCount + "_" + Math.random().toString(36).substr(2, 4),
                nameId: "",
                type: "占師",
                reports: Array(10).fill(null).map(() => ({ targetId: "", isWolf: false }))
            });
            saveToStorage();
            renderCoTable();
            renderSummary();
        });

        // CO行削減
        elBtnCoDown.addEventListener("click", function() {
            if (state.coRows.length <= 0) return;
            const lastRow = state.coRows[state.coRows.length - 1];
            
            // 行内のデータ入力確認
            let hasData = false;
            if (lastRow.nameId) hasData = true;
            lastRow.reports.forEach(r => { if (r.targetId) hasData = true; });

            if (hasData) {
                if (!confirm("削除するCOデータ行に変更された記録が残っています。削除しますか？")) {
                    return;
                }
            }

            state.coRows.pop();
            state.coCount = state.coRows.length;
            saveToStorage();
            renderCoTable();
            renderSummary();
        });

        // 自由メモの自動保存
        elFreeMemo.addEventListener("input", function() {
            state.freeMemo = elFreeMemo.value;
            saveToStorage();
        });

        // モーダルダイアログ制御
        elBtnOpenReset.addEventListener("click", function() {
            elResetModal.classList.add("active");
        });

        });

            state.players.forEach(p => {
                p.role = "";
                p.cert = "グレー";
                p.votes = Array(10).fill("");
            });

                });

            };

    // 参加人数の動的増減ロジック
    function adjustMemberCount(targetCount) {
        let currentCount = state.players.length;
        if (targetCount > currentCount) {
            // 不足分を追加
            for (let i = currentCount + 1; i <= targetCount; i++) {
                state.players.push({
                    id: "p_" + Date.now() + "_" + i + "_" + Math.random().toString(36).substr(2, 4),
                    name: String(i),
                    role: "",
                    cert: "グレー",
                    votes: Array(10).fill("")
                });
            }
        } else if (targetCount < currentCount) {
            // 超過分を切り捨て
            state.players.splice(targetCount);
        }
        state.memberCount = targetCount;
        
        // 脱落者データから存在しないプレイヤーのIDを消去
        for (let i = 0; i < 10; i++) {
            if (state.deaths.voted[i] && !state.players.some(p => p.id === state.deaths.voted[i])) state.deaths.voted[i] = "";
            if (state.deaths.bitten[i] && !state.players.some(p => p.id === state.deaths.bitten[i])) state.deaths.bitten[i] = "";
            state.coRows.forEach(c => {
                if (c.reports[i] && !state.players.some(p => p.id === c.reports[i].targetId)) {
                    c.reports[i].targetId = "";
                }
            });
        }
        
        saveToStorage();
        renderAll();
    }
    // 判定セレクトボックスの文字列に応じたカラークラス名のマッピング
    function getCertClass(certStr) {
        switch (certStr) {
            case "狼確": return "cert-wolf-cert";
            case "狼寄": return "cert-wolf-pref";
            case "狂人?": return "cert-mad";
            case "人確": return "cert-human-cert";
            case "人寄": return "cert-human-pref";
            default: return "cert-gray";
        }
    }

    // 死者リスト（吊り・噛み）に該当するかどうかをチェックする
    function getPlayerLifeStatus(playerId) {
        if (state.deaths.voted.includes(playerId)) return "voted";
        if (state.deaths.bitten.includes(playerId)) return "bitten";
        return "alive";
    }

            { key: "bitten", label: "襲撃（噛み）", style: "background-color: var(--status-bitten); color: white;" }

                selectD.appendChild(oNone);

                state.players.forEach(p => {

                    for (let day = 0; day < state.daysCount; day++) {

                colD.appendChild(selectD);

    // ④ 📊 自動集計データサマリー描画（日付順・昇順ソート固定版）
    function renderSummary() {
        elSummaryContainer.innerHTML = "";

        // アクティブ優先ソート（生存者が上、死亡者が下）
        const sortedPlayers = [...state.players].sort((a, b) => {
            const statusA = getPlayerLifeStatus(a.id);
            const statusB = getPlayerLifeStatus(b.id);
            const isDeadA = statusA !== "alive" ? 1 : 0;
            const isDeadB = statusB !== "alive" ? 1 : 0;
            return isDeadA - isDeadB;
        });

        sortedPlayers.forEach(player => {
            const lifeStatus = getPlayerLifeStatus(player.id);
            
            const card = document.createElement("div");
            card.className = "summary-card";

            if (lifeStatus !== "alive") {
                card.style.opacity = "0.5";
                card.style.textDecoration = "line-through";
            }

            let titleColor = "var(--text-white)";
            if (lifeStatus === "voted") {
                titleColor = "var(--color-wolf-cert)";
            } else if (lifeStatus === "bitten") {
                titleColor = "var(--color-wolf-pref)";
            } else {
                switch (player.cert) {
                    case "狼確": titleColor = "var(--color-wolf-cert)"; break;
                    case "狼寄": titleColor = "var(--color-wolf-pref)"; break;
                    case "狂人?": titleColor = "var(--color-mad)"; break;
                    case "人確": titleColor = "var(--color-human-cert)"; break;
                    case "人寄": titleColor = "var(--color-human-pref)"; break;
                    default: titleColor = "var(--text-white)"; break;
                }
            }

            let deathLog = "生存";
            if (lifeStatus === "voted") {
                const dayIdx = state.deaths.voted.indexOf(player.id);
                deathLog = (dayIdx + 1) + "日目 処刑脱落";
            } else if (lifeStatus === "bitten") {
                const dayIdx = state.deaths.bitten.indexOf(player.id);
                deathLog = (dayIdx + 1) + "日目 襲撃脱落";
            }

            const header = document.createElement("div");
            header.className = "summary-card-header";
            header.style.color = titleColor;
            header.innerHTML = `<span>${player.name} [${player.role || "役職未入力"} - ${player.cert}]</span> <span>${deathLog}</span>`;
            card.appendChild(header);

            const body = document.createElement("div");
            body.className = "summary-card-body";

            // 【投票履歴】 日付の若い順（d = 0から順番）に完全抽出・自動ソート
            let voteTexts = [];
            for (let d = 0; d < state.daysCount; d++) {
                if (player.votes[d]) {
                    const tar = state.players.find(p => p.id === player.votes[d]);
                    voteTexts.push(`${d + 1}日目➔${tar ? tar.name : "不明"}`);
                }
            }
            const divVote = document.createElement("div");
            divVote.innerHTML = `<span class="summary-item-title">【投票履歴】</span> ${voteTexts.length > 0 ? voteTexts.join(", ") : "なし"}`;
            body.appendChild(divVote);

            // 【被投票】 日付の若い順（d = 0から順番）に完全抽出・自動ソート
            let receivedVotes = [];
            for (let d = 0; d < state.daysCount; d++) {
                let voters = [];
                state.players.forEach(p => {
                    if (p.votes[d] === player.id) voters.push(p.name);
                });
                if (voters.length > 0) {
                    receivedVotes.push(`${d + 1}日目(${voters.join("・")})`);
                }
            }
            const divVoted = document.createElement("div");
            divVoted.innerHTML = `<span class="summary-item-title">【被投票】</span> ${receivedVotes.length > 0 ? receivedVotes.join(", ") : "なし"}`;
            body.appendChild(divVoted);
            // 【能力結果】 日付の若い順（d = 0から順番）に完全抽出・自動ソート
            let myReports = [];
            for (let d = 0; d < state.daysCount; d++) {
                state.coRows.forEach(c => {
                    if (c.nameId === player.id) {
                        if (c.reports[d] && c.reports[d].targetId) {
                            const tar = state.players.find(p => p.id === c.reports[d].targetId);
                            const isKnight = (c.type === "騎士" || c.type === "騎騙");
                            let resSign = isKnight ? (c.reports[d].isWolf ? "×失敗" : "○成功") : (c.reports[d].isWolf ? "●人狼" : "○人間");
                            myReports.push(`${d + 1}日目:${tar ? tar.name : "不明"}[${resSign}]`);
                        }
                    }
                });
            }
            const divMyRep = document.createElement("div");
            divMyRep.innerHTML = `<span class="summary-item-title">【能力結果】</span> ${myReports.length > 0 ? myReports.join(", ") : "なし"}`;
            body.appendChild(divMyRep);

            // 【被能力】 日付の若い順（d = 0から順番）に完全抽出・自動ソート
            let targetedReports = [];
            for (let d = 0; d < state.daysCount; d++) {
                state.coRows.forEach(c => {
                    if (c.reports[d] && c.reports[d].targetId === player.id) {
                        let coVocalist = state.players.find(p => p.id === c.nameId);
                        let coName = coVocalist ? coVocalist.name : "未選択CO";
                        const isKnight = (c.type === "騎士" || c.type === "騎騙");
                        let resSign = isKnight ? (c.reports[d].isWolf ? "失敗対象" : "護衛成功") : (c.reports[d].isWolf ? "●人狼判定" : "○人間判定");
                        targetedReports.push(`${coName}[${c.type}]から${d + 1}日目:${resSign}`);
                    }
                });
            }
            const divTargeted = document.createElement("div");
            divTargeted.innerHTML = `<span class="summary-item-title">【被能力】</span> ${targetedReports.length > 0 ? targetedReports.join(", ") : "なし"}`;
            body.appendChild(divTargeted);

            card.appendChild(body);
            elSummaryContainer.appendChild(card);
        });
    }

    // ドラッグ＆ドロップ（マウス・スマホ両対応）の並び替えエンジン
    function setupDragAndDrop(containerEl, type) {
        let draggedEl = null;

        const rows = containerEl.querySelectorAll(".table-row-item");
        rows.forEach(row => {
            const handle = row.querySelector(".col-handle");
            handle.setAttribute("draggable", "true");

            handle.addEventListener("dragstart", (e) => {
                draggedEl = row;
                row.classList.add("dragging");
                e.dataTransfer.effectAllowed = "move";
            });
            handle.addEventListener("dragend", () => {
                if (draggedEl) {
                    draggedEl.classList.remove("dragging");
                    draggedEl = null;
                }
                saveOrder(containerEl, type);
            });

            handle.addEventListener("touchstart", (e) => {
                draggedEl = row;
                row.classList.add("dragging");
            }, { passive: true });

            handle.addEventListener("touchmove", (e) => {
                if (!draggedEl) return;
                const touch = e.touches[0];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                if (!target) return;
                const nextRow = target.closest(".table-row-item");
                if (nextRow && nextRow !== draggedEl && nextRow.parentNode === containerEl) {
                    const rect = nextRow.getBoundingClientRect();
                    const next = (touch.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                    containerEl.insertBefore(draggedEl, next ? nextRow.nextSibling : nextRow);
                }
            }, { passive: true });

            handle.addEventListener("touchend", () => {
                if (draggedEl) {
                    draggedEl.classList.remove("dragging");
                    draggedEl = null;
                }
                saveOrder(containerEl, type);
            });
        });

        containerEl.addEventListener("dragover", (e) => {
            e.preventDefault();
            if (!draggedEl) return;
            const target = e.target.closest(".table-row-item");
            if (target && target !== draggedEl && target.parentNode === containerEl) {
                const rect = target.getBoundingClientRect();
                const next = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                containerEl.insertBefore(draggedEl, next ? target.nextSibling : target);
            }
        });
    }

    // ドラッグ終了後のインデックス順序を並び替えてlocalStorageに保存
    function saveOrder(containerEl, type) {
        const rows = Array.from(containerEl.querySelectorAll(".table-row-item"));
        const newOrderIds = rows.map(r => r.dataset.id);

        if (type === "player") {
            const newPlayers = [];
            newOrderIds.forEach(id => {
                const found = state.players.find(p => p.id === id);
                if (found) newPlayers.push(found);
            });
            state.players = newPlayers;
        } else if (type === "co") {
            const newCo = [];
            newOrderIds.forEach(id => {
                const found = state.coRows.find(c => c.id === id);
                if (found) newCo.push(found);
            });
            state.coRows = newCo;
        }

        saveToStorage();
        renderAll();
    }

    // 起動
    init();
})();
</script>
</body>
</html>
